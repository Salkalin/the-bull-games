<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <!-- PROTECTED: meta type -->
    <meta name="type" value="app" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Бычий Замес</title>
    <meta property="og:title" content="Бычий Замес">
    <meta property="og:description" content="3D-раннер: собирай мясо, уворачивайся от ножей Шефа и получи промокод.">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
    <meta property="og:type" content="website">
    <style>
        *{box-sizing:border-box;user-select:none;-webkit-tap-highlight-color:transparent}
        body{margin:0;overflow:hidden;background:#15110f;font-family:'Space Grotesk',sans-serif;color:#f4efe9}
        #canvas{display:block;width:100vw;height:100vh;touch-action:none}
        .hud{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;padding:20px 24px;pointer-events:none}
        .pill{background:rgba(21,17,15,.75);color:#f4efe9;padding:10px 18px;border-radius:12px;font-weight:700;font-size:20px;display:flex;gap:10px;align-items:center}
        .pill i{color:#e0482f}
        #warn{position:fixed;top:90px;left:50%;transform:translateX(-50%);background:#e0482f;color:#fff;padding:10px 20px;border-radius:10px;font-weight:700;display:none;text-align:center;animation:p .5s infinite alternate}
        @keyframes p{to{transform:translateX(-50%) scale(1.06)}}
        .screen{position:fixed;inset:0;background:rgba(21,17,15,.92);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px}
        .screen h1{font-size:52px;margin:0 0 8px;color:#f4efe9;letter-spacing:-1px;line-height:1}
        .screen h1 span{color:#e0482f}
        .screen p{color:#b9aea4;max-width:340px;line-height:1.6;margin:0 0 24px}
        .ctrl{background:#221c19;border:1px solid #3a302b;border-radius:14px;padding:16px 20px;text-align:left;margin-bottom:28px;line-height:2;color:#d9cfc6;font-size:14px}
        .ctrl i{color:#e0482f;width:24px}
        button{background:#e0482f;color:#fff;border:0;padding:14px 40px;font:700 18px 'Space Grotesk';border-radius:12px;cursor:pointer;transition:transform .2s,background .2s}
        button:hover{background:#c73b24;transform:translateY(-2px)}
        .hidden{display:none!important}
        .rank{color:#e8b04a;font-size:24px;font-weight:700}
        .big{font-size:64px;font-weight:700;color:#f4efe9;margin:6px 0}
        .qr{background:#fff;padding:10px;border-radius:12px;margin-top:10px}
        .qr img{width:140px;height:140px;display:block}
        #vig{position:fixed;inset:0;pointer-events:none;opacity:0;background:radial-gradient(ellipse at center,rgba(224,40,20,0) 35%,rgba(224,40,20,.85) 100%)}
        #vig.on{animation:vg .5s ease-out forwards}
        @keyframes vg{from{opacity:1}to{opacity:0}}
        #over{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;font-size:48px;font-weight:700;color:#f4efe9;letter-spacing:-1px;text-align:center;opacity:0;transform:scale(1.3);transition:opacity .5s,transform .5s}
        #over span{color:#e0482f}
        #over.on{opacity:1;transform:scale(1)}
        .code{margin-top:12px;background:#f4efe9;color:#e0482f;padding:6px 16px;border-radius:8px;font-weight:700;letter-spacing:2px}
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

</head>
<body>
    <canvas id="canvas"></canvas>
    <div class="hud">
        <div class="pill"><i class="fa-solid fa-drumstick-bite"></i><span id="score">0</span></div>
        <div class="pill"><i class="fa-solid fa-heart"></i><span id="lives">3</span></div>
        <div class="pill"><i class="fa-solid fa-clock"></i><span id="time">180</span></div>
    </div>
    <div id="warn"><i class="fa-solid fa-triangle-exclamation" style="color:#fff"></i> ШЕФ БРОСАЕТ НОЖИ!</div>
    <div id="vig"></div>
    <div id="over">ЗАБЕГ <span>&nbsp;ОКОНЧЕН</span></div>
    <div class="screen" id="start">
        <h1>БЫЧИЙ<br><span>ЗАМЕС</span></h1>
        <p>Собирай мясо, прыгай за окороками на крюках и уворачивайся от ножей Шефа.</p>
        <div class="ctrl">
            <div><i class="fa-solid fa-arrows-left-right"></i>Свайп / ← → — смена полосы</div>
            <div><i class="fa-solid fa-arrow-up"></i>Свайп вверх / ↑ / Пробел — прыжок</div>
            <div><i class="fa-solid fa-arrow-down"></i>Свайп вниз / ↓ — подкат</div>
            <div><i class="fa-solid fa-ban"></i>Избегай бургеров и ножей</div>
        </div>
        <button id="go">ПОГНАЛИ</button>
    </div>
    <div class="screen hidden" id="end">
        <h1>ЗАБЕГ <span>ОКОНЧЕН</span></h1>
        <div class="rank" id="rank"></div>
        <div class="big" id="final">0</div>
        <div class="qr"><img id="qr" alt="QR"></div>
        <div class="code" id="promo"></div>
        <p style="margin-top:14px">Покажи этот QR официанту!</p>
        <button id="again">ЗАНОВО</button>
    </div>
<script>
const $=id=>document.getElementById(id);
const renderer=new THREE.WebGLRenderer({canvas:$('canvas'),antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled=true;
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x2a211d);
scene.fog=new THREE.Fog(0x2a211d,30,110);
const camera=new THREE.PerspectiveCamera(60,1,0.1,200);
camera.position.set(0,5,9);camera.lookAt(0,1.5,-6);
function resize(){renderer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();}
addEventListener('resize',resize);resize();
scene.add(new THREE.HemisphereLight(0xfff1e0,0x3a2a22,0.7));
const sun=new THREE.DirectionalLight(0xffffff,0.8);sun.position.set(5,12,6);sun.castShadow=true;
sun.shadow.camera.left=-10;sun.shadow.camera.right=10;sun.shadow.camera.top=10;sun.shadow.camera.bottom=-20;
scene.add(sun);

const LANE=2.6, M=(c,o={})=>new THREE.MeshLambertMaterial(Object.assign({color:c},o));
// Пол-плитка
const tc=document.createElement('canvas');tc.width=tc.height=128;const g=tc.getContext('2d');
g.fillStyle='#d9d2c8';g.fillRect(0,0,128,128);g.strokeStyle='#a99f94';g.lineWidth=4;g.strokeRect(0,0,64,64);g.strokeRect(64,64,64,64);g.strokeRect(64,0,64,64);g.strokeRect(0,64,64,64);
const tex=new THREE.CanvasTexture(tc);tex.wrapS=tex.wrapT=THREE.RepeatWrapping;tex.repeat.set(4,60);
const floor=new THREE.Mesh(new THREE.PlaneGeometry(10,240),M(0xffffff,{map:tex}));
floor.rotation.x=-Math.PI/2;floor.position.z=-100;floor.receiveShadow=true;scene.add(floor);
// Стены
[-6,6].forEach(x=>{const w=new THREE.Mesh(new THREE.BoxGeometry(0.5,8,240),M(0x8a3b2b));w.position.set(x,4,-100);scene.add(w);});
// Декор: рельсы с крюками сверху, движутся
const deco=[];
for(let i=0;i<14;i++){
  const gr=new THREE.Group();
  const bar=new THREE.Mesh(new THREE.BoxGeometry(11,0.2,0.2),M(0x555555));bar.position.y=7.5;gr.add(bar);
  [-5,5].forEach(x=>{const p=new THREE.Mesh(new THREE.BoxGeometry(0.3,7.5,0.3),M(0x444444));p.position.set(x,3.75,0);gr.add(p);});
  gr.position.z=-i*12;scene.add(gr);deco.push(gr);
}
// Быки
function makeBull(color){
  const b=new THREE.Group();
  const body=new THREE.Mesh(new THREE.BoxGeometry(1.2,1,1.8),M(color));body.position.y=1.2;b.add(body);
  const head=new THREE.Mesh(new THREE.BoxGeometry(0.9,0.8,0.8),M(color));head.position.set(0,1.7,-1.1);b.add(head);
  const snout=new THREE.Mesh(new THREE.BoxGeometry(0.7,0.4,0.2),M(0xe8b8a0));snout.position.set(0,1.5,-1.55);b.add(snout);
  [-1,1].forEach(s=>{const h=new THREE.Mesh(new THREE.ConeGeometry(0.12,0.6,8),M(0xf4efe9));h.position.set(s*0.55,2.2,-1.1);h.rotation.z=-s*0.8;b.add(h);});
  b.legs=[];
  [[-.4,-.6],[.4,-.6],[-.4,.6],[.4,.6]].forEach(([x,z])=>{const l=new THREE.Mesh(new THREE.BoxGeometry(0.3,0.8,0.3),M(0x2a1a14));l.position.set(x,0.4,z);b.add(l);b.legs.push(l);});
  b.traverse(o=>{if(o.isMesh)o.castShadow=true;});
  return b;
}
const player=makeBull(0x6b3a22);scene.add(player);
// Шеф
const chef=new THREE.Group();
const cb=new THREE.Mesh(new THREE.CylinderGeometry(1.2,1.4,3,12),M(0xf4efe9));cb.position.y=1.5;chef.add(cb);
const ch=new THREE.Mesh(new THREE.SphereGeometry(0.9,16,12),M(0xe8b896));ch.position.y=3.6;chef.add(ch);
const hat=new THREE.Mesh(new THREE.CylinderGeometry(0.8,0.7,1.2,12),M(0xffffff));hat.position.y=4.9;chef.add(hat);
const chefArm=new THREE.Group();chefArm.position.set(1.35,2.7,0);
const armM=new THREE.Mesh(new THREE.BoxGeometry(0.4,1.7,0.4),M(0xf4efe9));armM.position.y=-0.85;chefArm.add(armM);chef.add(chefArm);
const flash=new THREE.Mesh(new THREE.SphereGeometry(1.5,12,10),new THREE.MeshBasicMaterial({color:0xff2010,transparent:true,opacity:0,depthWrite:false}));
flash.position.y=3;flash.visible=false;chef.add(flash);
let throwT=0;const THROW=0.35;
function chefThrow(){throwT=THROW;}
chef.position.set(0,0,-45);chef.visible=false;scene.add(chef);

// Объекты
const MAT={
 meat:M(0xb8322a),fat:M(0xf2e6d8),bread:M(0xd8a050),
 bun:M(0x7cff2a,{emissive:0x1f5a00}),patty:M(0x2a5a10),leaf:M(0xc8ff40,{emissive:0x305000}),
 rope:M(0x888888),ham:M(0xff2414,{emissive:0x5a0800}),bone:M(0xf4efe9),
 blade:M(0xffffff,{emissive:0xff3020,emissiveIntensity:0.7}),handle:M(0x2a1a14),
 glow:new THREE.MeshBasicMaterial({color:0xff2010,transparent:true,opacity:0.5,depthWrite:false,side:THREE.DoubleSide}),
 barrier:M(0xe8b04a)
};
const GEO={meat:new THREE.BoxGeometry(1,.35,.7),fat:new THREE.BoxGeometry(1.05,.36,.15),bread:new THREE.CylinderGeometry(.25,.25,1.4,10),
 bun:new THREE.CylinderGeometry(.55,.55,.25,16),bunTop:new THREE.CylinderGeometry(.55,.55,.3,16),patty:new THREE.CylinderGeometry(.55,.55,.2,16),leaf:new THREE.CylinderGeometry(.6,.6,.06,16),
 rope:new THREE.CylinderGeometry(.03,.03,2,6),ham:new THREE.SphereGeometry(.55,12,10),bone:new THREE.CylinderGeometry(.1,.1,.6,8),
 blade:new THREE.BoxGeometry(1.4,.35,.05),handle:new THREE.BoxGeometry(.6,.2,.15),glow:new THREE.PlaneGeometry(2.4,1),barrier:new THREE.BoxGeometry(2.2,1,.5)};
const mk=(g,m,y=0)=>{const o=new THREE.Mesh(g,m);o.position.y=y;return o;};
const build={
 meat:()=>{const m=mk(GEO.meat,MAT.meat);const f=mk(GEO.fat,MAT.fat);f.position.z=.3;m.add(f);m.baseY=.8;return m;},
 bread:()=>{const m=mk(GEO.bread,MAT.bread);m.rotation.z=Math.PI/2;m.baseY=.8;return m;},
 burger:()=>{const gr=new THREE.Group();gr.add(mk(GEO.bun,MAT.bun,0),mk(GEO.patty,MAT.patty,.22),mk(GEO.leaf,MAT.leaf,.35),mk(GEO.bunTop,MAT.bun,.5));gr.baseY=.4;return gr;},
 hanging:()=>{const gr=new THREE.Group();gr.add(mk(GEO.rope,MAT.rope,1));const h=mk(GEO.ham,MAT.ham);h.scale.y=1.4;gr.add(h);gr.add(mk(GEO.bone,MAT.bone,-.8));gr.baseY=3.6;return gr;},
 knife:()=>{const gr=new THREE.Group();const gl=mk(GEO.glow,MAT.glow);gl.position.x=.3;gl.isGlow=true;gr.add(gl);gr.add(mk(GEO.blade,MAT.blade));const hd=mk(GEO.handle,MAT.handle);hd.position.x=1;gr.add(hd);return gr;},
 barrier:()=>{const m=mk(GEO.barrier,MAT.barrier);m.baseY=.5;return m;}
};
const pool={};
function take(kind){const p=pool[kind]||(pool[kind]=[]);let m=p.pop();
 if(!m){m=build[kind]();m.traverse(o=>{if(o.isMesh&&!o.isGlow)o.castShadow=true;});scene.add(m);}
 m.visible=true;m.rotation.y=0;return m;}
function give(kind,m){m.visible=false;pool[kind].push(m);}
['meat','bread','burger','hanging','knife','barrier'].forEach(k=>{const a=[];for(let i=0;i<10;i++)a.push(take(k));a.forEach(m=>give(k,m));});
const TYPES={
 meat:{pts:50,good:true,h:'low'},bread:{pts:20,good:true,h:'low'},hanging:{pts:100,good:true,h:'air'},
 burger:{pts:-50,good:false,h:'low',hurt:false},
 knife_low:{pts:-100,good:false,h:'low',hurt:true},knife_high:{pts:-100,good:false,h:'high',hurt:true},
 barrier:{pts:0,good:false,h:'low',hurt:true}
};
let items=[],parts=[];
function spawn(type,lane,z){
 const kind=type.startsWith('knife')?'knife':type;
 const m=take(kind);
 m.position.set((lane-1)*LANE,type==='knife_low'?0.6:type==='knife_high'?2.3:m.baseY,z);
 items.push({type,kind,lane,m,hit:false,...TYPES[type]});
}
const PGEO=new THREE.BoxGeometry(0.15,0.15,0.15);
const PMAT={good:new THREE.MeshBasicMaterial({color:0xe8b04a}),bad:new THREE.MeshBasicMaterial({color:0xe0482f})};
for(let i=0;i<60;i++){const p=new THREE.Mesh(PGEO,PMAT.good);p.visible=false;p.life=0;p.v=new THREE.Vector3();scene.add(p);parts.push(p);}
function burst(pos,good){
 let n=12;
 for(const p of parts){if(n<=0)break;if(p.life>0)continue;n--;
  p.material=good?PMAT.good:PMAT.bad;p.position.copy(pos);p.v.set((Math.random()-.5)*8,Math.random()*6+2,(Math.random()-.5)*6);p.life=0.7;p.visible=true;}
}
const tmpV=new THREE.Vector3();
function hurtFx(){const v=$('vig');v.classList.remove('on');void v.offsetWidth;v.classList.add('on');}

// Состояние
let state='start',score,lives,timeLeft,roundTime,round,speed,lane,px,jumpT,slideT,spawnT,boss,shake=0,dist=0,dieT=0;
const JUMP=0.7,SLIDE=0.6;
function reset(){
 items.forEach(i=>give(i.kind,i.m));items=[];
 player.rotation.set(0,0,0);player.position.y=0;dieT=0;throwT=0;
 $('over').classList.remove('on');
 score=0;lives=3;timeLeft=180;roundTime=36;round=1;speed=18;lane=1;px=0;jumpT=0;slideT=0;spawnT=1;boss=false;
 chef.visible=false;$('warn').style.display='none';hud();
}
function hud(){$('score').textContent=score;$('lives').textContent=lives;$('time').textContent=Math.ceil(timeLeft);}
function move(d){if(state!=='run')return;lane=Math.max(0,Math.min(2,lane+d));}
function jump(){if(state==='run'&&jumpT<=0){jumpT=JUMP;slideT=0;}}
function slide(){if(state==='run'&&slideT<=0){slideT=SLIDE;if(jumpT>0)jumpT=Math.min(jumpT,0.15);}}
addEventListener('keydown',e=>{
 if(['ArrowLeft','a','A'].includes(e.key))move(-1);
 if(['ArrowRight','d','D'].includes(e.key))move(1);
 if(['ArrowUp','w','W',' '].includes(e.key)){e.preventDefault();jump();}
 if(['ArrowDown','s','S'].includes(e.key))slide();
});
let sx=0,sy=0;
addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY;},{passive:true});
addEventListener('touchend',e=>{
 const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;
 if(Math.max(Math.abs(dx),Math.abs(dy))<30)return;
 if(Math.abs(dx)>Math.abs(dy))move(dx>0?1:-1);else dy<0?jump():slide();
});

function spawner(dt){
 spawnT-=dt;if(spawnT>0)return;
 const z=-90,l=Math.floor(Math.random()*3),r=Math.random();
 if(boss){
  spawn(r>0.5?'knife_high':'knife_low',l,z);chefThrow();
  if(Math.random()<0.3)spawn('meat',(l+1+Math.floor(Math.random()*2))%3,z);
  spawnT=Math.max(0.35,0.9-round*0.1);
 }else{
  if(r>0.85)spawn('hanging',l,z);
  else if(r>0.6)spawn('meat',l,z);
  else if(r>0.42)spawn('bread',l,z);
  else if(r>0.22)spawn('burger',l,z);
  else spawn('barrier',l,z);
  if(Math.random()>0.55)spawn(Math.random()>0.5?'meat':'bread',(l+1)%3,z);
  spawnT=Math.max(0.3,0.65-round*0.05);
 }
}
function endGame(){
 if(state!=='run')return;
 state='dying';dieT=0;jumpT=0;slideT=0;
 $('warn').style.display='none';$('over').classList.add('on');
}
function showEnd(){
 state='end';$('over').classList.remove('on');
 $('final').textContent=score;
 let rank='Телятина';if(score>2000)rank='Стейк';if(score>5000)rank='Бычий Аппетит';if(score>8000)rank='ЛЕГЕНДА ГРИЛЯ';
 $('rank').textContent=rank;
 const code='BULL-'+Math.random().toString(36).substring(2,8).toUpperCase();
 $('promo').textContent=code;$('qr').src='https://api.qrserver.com/v1/create-qr-code/?size=150x150&data='+code;
 $('warn').style.display='none';$('end').classList.remove('hidden');
}
function update(dt){
 timeLeft-=dt;roundTime-=dt;speed+=dt*0.08;
 if(timeLeft<=0){timeLeft=0;hud();return endGame();}
 if(roundTime<=10&&!boss){boss=true;chef.visible=true;$('warn').style.display='block';}
 else if(roundTime<=0){boss=false;chef.visible=false;roundTime=36;round++;$('warn').style.display='none';}
 jumpT=Math.max(0,jumpT-dt);slideT=Math.max(0,slideT-dt);
 spawner(dt);
 const jumping=jumpT>0,sliding=slideT>0;
 for(let i=items.length-1;i>=0;i--){
  const it=items[i];it.m.position.z+=speed*dt;
  if(it.type.startsWith('knife'))it.m.rotation.y+=dt*10;
  else if(it.good)it.m.rotation.y+=dt*2;
  const z=it.m.position.z;
  if(!it.hit&&it.lane===lane&&z>-1.5&&z<1.5){
   let hit=false;
   if(it.h==='low'&&!jumping)hit=true;
   if(it.h==='air'&&jumping)hit=true;
   if(it.h==='high'&&!sliding)hit=true;
   if(hit){
    it.hit=true;score=Math.max(0,score+it.pts);
    burst(tmpV.copy(it.m.position).setY(1.2),it.good);
    it.m.visible=false;
    if(!it.good){shake=0.3;navigator.vibrate&&navigator.vibrate(60);}
    if(it.hurt){lives--;hurtFx();if(lives<=0){hud();return endGame();}}
    hud();
   }
  }
  if(z>12){give(it.kind,it.m);items.splice(i,1);}
 }
 if(Math.random()<dt*2)hud();else $('time').textContent=Math.ceil(timeLeft);
}
let last=performance.now();
function loop(t){
 const dt=Math.min(0.05,(t-last)/1000);last=t;
 let sp=state==='run'?speed:6;
 if(state==='run')update(dt);
 const dying=state==='dying';
 if(dying){dieT+=dt;const k=Math.min(1,dieT/0.9);sp=speed*Math.max(0,1-dieT*1.5);
  player.rotation.z=-Math.PI/2*(k*k);player.position.y=0.6*k;if(dieT>1.8)showEnd();}
 dist+=sp*dt;
 tex.offset.y=dist/4;
 deco.forEach(d=>{d.position.z+=sp*dt;if(d.position.z>12)d.position.z-=168;});
 // Игрок
 px+=((lane-1)*LANE-px)*Math.min(1,dt*14);
 player.position.x=px;
 if(!dying&&state!=='end'){
  player.rotation.z=((lane-1)*LANE-px)*-0.15;
  const jt=jumpT>0?1-jumpT/JUMP:0;
  player.position.y=jumpT>0?Math.sin(jt*Math.PI)*2.6:0;
  const run=t*0.02;
  player.legs.forEach((l,i)=>l.rotation.x=jumpT>0?0.6:Math.sin(run+(i%2?Math.PI:0)+(i>1?Math.PI:0))*0.7);
 }
 player.scale.y+=(((slideT>0)?0.45:1)-player.scale.y)*Math.min(1,dt*20);
 if(chef.visible){chef.position.x=Math.sin(t*0.002)*3;chef.rotation.y=Math.sin(t*0.004)*0.4;}
 if(throwT>0){throwT=Math.max(0,throwT-dt);const k=throwT/THROW;
  chefArm.rotation.x=-Math.sin((1-k)*Math.PI)*2.6;flash.visible=k>0;flash.material.opacity=k*0.7;flash.scale.setScalar(1+(1-k)*2.5);}
 else{chefArm.rotation.x=0;flash.visible=false;}
 for(const p of parts){if(p.life<=0)continue;p.life-=dt;p.v.y-=15*dt;p.position.addScaledVector(p.v,dt);if(p.life<=0)p.visible=false;}
 shake=Math.max(0,shake-dt);
 camera.position.x=px*0.4+(Math.random()-.5)*shake;
 camera.position.y=5+(Math.random()-.5)*shake;
 camera.lookAt(px*0.4,1.5,-6);
 renderer.render(scene,camera);
 requestAnimationFrame(loop);
}
reset();requestAnimationFrame(loop);
function start(){reset();state='run';$('start').classList.add('hidden');$('end').classList.add('hidden');}
$('go').onclick=start;$('again').onclick=start;
</script>
